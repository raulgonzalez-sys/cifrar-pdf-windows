[project]
name = "cifrarpdf"
version = "1.0.0"
description = "Cifrar PDF (FISAT) para Windows 10/11: cifra con contraseña los PDF que se sueltan en carpetas del Escritorio"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "PyQt6==6.11.0",
    "pikepdf==10.13.0.post1",
    "watchdog==6.0.0",
    "keyring==25.7.0",
]

[project.optional-dependencies]
# pillow solo hace falta para regenerar el icono (herramientas/generar_icono.py).
dev = ["pytest==9.1.1", "ruff==0.16.6", "pyinstaller==6.22.2", "pillow==12.3.0"]

[tool.setuptools]
packages = ["cifrarpdf"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# gui.py es copia SINCRONIZADA de archivos/fisat-cifrar-pdf-gui (debian13-fisat):
# su formato lo manda el fichero canónico, no el linter de esta repo. Ordenar
# aquí los imports rompería la igualdad byte a byte entre las dos copias, que es
# justo lo que la regla de sincronía comprueba (ver GUI_SYNC.md).
"gui.py" = ["I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
