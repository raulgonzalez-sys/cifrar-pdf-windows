name: CI

# Se ejecuta en windows-latest a propósito: es el único sitio donde estas
# pruebas valen algo. El backend usa el registro, DPAPI, el Administrador de
# credenciales, mútex y eventos con nombre — en Linux la mitad son ramas de
# desarrollo que no representan lo que hará el equipo de una trabajadora.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests
        # La ventana se construye sin pantalla; el resto del backend corre de
        # verdad contra el Windows del runner.
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Construir los ejecutables
        run: pyinstaller empaquetar/CifrarPDF.spec --noconfirm

      - name: Comprobar que el ejecutable de consola responde
        # La prueba más básica y la que más veces se rompe al empaquetar: que el
        # .exe arranque y conteste el contrato --gui-*. Si un «hiddenimport»
        # falta, esto lo caza aquí y no en el equipo de una trabajadora.
        shell: pwsh
        run: |
          $salida = & "dist\CifrarPDF\CifrarPDF-cli.exe" --gui-estado
          if ($salida -notmatch '^[01]$') { throw "--gui-estado devolvió: '$salida'" }
          $lista = & "dist\CifrarPDF\CifrarPDF-cli.exe" --gui-listar
          if ($LASTEXITCODE -ne 0) { throw "--gui-listar falló con $LASTEXITCODE" }
          & "dist\CifrarPDF\CifrarPDF-cli.exe" --ayuda | Select-Object -First 1
          # Sin la traducción de Qt los botones estándar del vigilante salen en
          # inglés («OK», «Cancel»): en Windows no los traduce nadie más.
          $qm = Get-ChildItem "dist\CifrarPDF" -Recurse -Filter qtbase_es.qm
          if (-not $qm) { throw "falta qtbase_es.qm en dist\CifrarPDF" }

      - name: Ciclo completo con el vigilante (alta, cifrado real, baja)
        shell: pwsh
        env:
          # Sin icono en el área de notificación a propósito: cifrar NO puede
          # depender de que haya bandeja. Con bandeja lo prueba escritorio.yml.
          CIFRARPDF_SIN_BANDEJA: "1"
        run: |
          $env:CIFRARPDF_CONFIG_DIR = "$env:RUNNER_TEMP\cfg"
          $env:CIFRARPDF_DATOS_DIR  = "$env:RUNNER_TEMP\datos"
          $env:CIFRARPDF_ESCRITORIO = "$env:RUNNER_TEMP\Escritorio"
          New-Item -ItemType Directory -Force -Path $env:CIFRARPDF_ESCRITORIO | Out-Null
          $exe = "dist\CifrarPDF\CifrarPDF-cli.exe"
          $log = "$env:CIFRARPDF_DATOS_DIR\cifrar-pdf.log"
          # Contraseña sin acentos A PROPÓSITO: aquí se prueba el circuito, no la
          # codificación de PowerShell. Los acentos y símbolos en la contraseña
          # los cubre tests/test_secreto.py, que no pasa por una tubería del shell.
          $clave = "contrasena-de-prueba"

          # 1. Alta: crea la carpeta, guarda la contraseña en el Administrador de
          #    credenciales de Windows y arranca el vigilante.
          $alta = $clave | & $exe --gui-add "Informes"
          if ($alta -ne "OK informes") { throw "alta: '$alta'" }
          $carpeta = "$env:CIFRARPDF_ESCRITORIO\Informes"
          if (-not (Test-Path $carpeta)) { throw "no creó la carpeta" }

          # 2. El listado: seis campos, con carpeta existente, contraseña puesta
          #    y modo «fija». El 6º campo es el contrato que lee la ventana para
          #    saber si tiene que pintar «Pregunta cada vez».
          $fila = (& $exe --gui-listar) -split "`t"
          if ($fila.Count -ne 6) { throw "listado con $($fila.Count) campos" }
          if ($fila[3] -ne "1" -or $fila[4] -ne "1") { throw "listado: $($fila -join '|')" }
          if ($fila[5] -ne "fija") { throw "modo inesperado: $($fila[5])" }

          # 3. El vigilante tiene que registrarse: arrancar el ejecutable y cargar
          #    sus dependencias tarda unos segundos en un runner frío.
          $activo = "0"
          foreach ($i in 1..60) {
            $activo = & $exe --gui-estado
            if ($activo -eq "1") { break }
            Start-Sleep -Milliseconds 500
          }
          if ($activo -ne "1") {
            if (Test-Path $log) { Get-Content $log }
            throw "el vigilante no se registró en 30 s"
          }

          # 4. Lo que de verdad importa: soltar un PDF y que quede protegido.
          python herramientas\pdf_de_prueba.py "$env:RUNNER_TEMP\prueba.pdf" 2
          Copy-Item "$env:RUNNER_TEMP\prueba.pdf" "$carpeta\informe.pdf"
          $cifrado = $false
          foreach ($i in 1..60) {
            python herramientas\es_cifrado.py "$carpeta\informe.pdf" *> $null
            if ($LASTEXITCODE -eq 0) { $cifrado = $true; break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $cifrado) {
            if (Test-Path $log) { Get-Content $log }
            throw "el PDF NO se cifró en 30 s"
          }

          # 5. Y que se abra con su contraseña, con el contenido intacto.
          python -c "import pikepdf,sys; d=pikepdf.open(sys.argv[1], password=sys.argv[2]); assert len(d.pages)==2, 'páginas perdidas'; assert d.encryption.R==6, 'no es AES-256'; print('abre con la contraseña, 2 páginas, AES-256')" "$carpeta\informe.pdf" $clave

          # 6. Modo «preguntar cada vez»: el alta NO debe leer la entrada
          #    estándar (no hay contraseña que guardar). Si la leyera, aquí se
          #    quedaría esperando o daría error de contraseña inválida. Va antes
          #    de la baja final para que la comprobación de «no queda vigilante»
          #    cubra también esta carpeta.
          $alta = & $exe --gui-add "Pregunta" --modo preguntar
          if ($alta -ne "OK pregunta") { throw "alta preguntando: '$alta'" }
          $filas = (& $exe --gui-listar) -split "`r?`n" | Where-Object { $_ }
          $pregunta = $filas | Where-Object { $_ -like "pregunta`t*" }
          $campos = $pregunta -split "`t"
          if ($campos[4] -ne "0" -or $campos[5] -ne "preguntar") {
            throw "listado tras el alta preguntando: $($campos -join '|')"
          }

          #    El registro se lee compartido: el vigilante lo sigue escribiendo y
          #    una lectura que no comparta escritura podría chocar con él.
          function Contar-EnRegistro($texto) {
            if (-not (Test-Path $log)) { return 0 }
            $fs = [System.IO.File]::Open($log, 'Open', 'Read', 'ReadWrite')
            try { $contenido = (New-Object System.IO.StreamReader($fs)).ReadToEnd() } finally { $fs.Dispose() }
            return ([regex]::Matches($contenido, [regex]::Escape($texto))).Count
          }

          #    Sin bandeja no hay a quién preguntar: el PDF se queda marcado
          #    SIN-CIFRAR_. Antes de soltarlo se espera a que el vigilante
          #    relanzado por el alta ya vigile la carpeta (esa línea del registro
          #    se escribe con el observador en marcha), y un poco más: el hilo
          #    del observador tarda un instante en empezar a recibir cambios.
          $vigila = $false
          foreach ($i in 1..60) {
            if ((Contar-EnRegistro "no se pregunta hasta que se suelte un PDF") -gt 0) { $vigila = $true; break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $vigila) {
            if (Test-Path $log) { Get-Content $log }
            throw "el vigilante no vigila la carpeta que pregunta en 30 s"
          }
          Start-Sleep -Seconds 2
          $dirPregunta = "$env:CIFRARPDF_ESCRITORIO\Pregunta"
          Copy-Item "$env:RUNNER_TEMP\prueba.pdf" "$dirPregunta\informe.pdf"
          $marcado = "$dirPregunta\SIN-CIFRAR_informe.pdf"
          $hayMarca = $false
          foreach ($i in 1..60) {
            if (Test-Path $marcado) { $hayMarca = $true; break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $hayMarca) {
            if (Test-Path $log) { Get-Content $log }
            throw "el PDF no quedó marcado SIN-CIFRAR_ en 30 s"
          }

          #    Pasar a contraseña fija NO reinicia el vigilante: le pide que barra
          #    la carpeta, y el marcado se cifra y recupera su nombre.
          $inicios = Contar-EnRegistro "Iniciando vigilancia"
          $fija = $clave | & $exe --gui-set-pass pregunta --modo fija
          if ($fija -ne "OK") { throw "paso a fija: '$fija'" }
          $barrido = $false
          foreach ($i in 1..60) {
            python herramientas\es_cifrado.py "$dirPregunta\informe.pdf" *> $null
            if ($LASTEXITCODE -eq 0 -and -not (Test-Path $marcado)) { $barrido = $true; break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $barrido) {
            if (Test-Path $log) { Get-Content $log }
            throw "el paso a fija no cifró el PDF marcado en 30 s"
          }
          $despues = Contar-EnRegistro "Iniciando vigilancia"
          if ($despues -ne $inicios) {
            if (Test-Path $log) { Get-Content $log }
            throw "el paso a fija reinició el vigilante ($inicios -> $despues arranques)"
          }

          $baja = & $exe --gui-remove "pregunta" --borrar-carpeta
          if ($baja -ne "OK") { throw "baja de la que pregunta: '$baja'" }

          # 7. Baja: para el vigilante SIN dejar procesos sueltos y borra la carpeta.
          $baja = & $exe --gui-remove "informes" --borrar-carpeta
          if ($baja -ne "OK") { throw "baja: '$baja'" }
          if (Test-Path $carpeta) { throw "no borró la carpeta" }
          $activo = & $exe --gui-estado
          if ($activo -ne "0") {
            if (Test-Path $log) { Get-Content $log }
            throw "el vigilante sigue activo tras la baja (quedaría huérfano)"
          }

          Write-Host "--- registro del vigilante ---"
          if (Test-Path $log) { Get-Content $log }

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          # OJO con la sintaxis: "$env:ProgramFiles(x86)" NO vale en PowerShell.
          # Parsea $env:ProgramFiles y deja «(x86)» como texto literal, así que
          # sale «C:\Program Files(x86)\...» y no encuentra nada — es lo que hizo
          # fallar este paso la primera vez. Con el nombre entre llaves sí:
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          # Los runners ya traen Inno Setup 6; solo se instala si faltara.
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw "No encuentro ISCC.exe en $iscc" }
          & $iscc empaquetar\CifrarPDF.iss

      - uses: actions/upload-artifact@v4
        with:
          name: CifrarPDF-Setup
          path: salida/*.exe
          if-no-files-found: error
