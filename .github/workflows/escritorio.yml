name: Escritorio (temporal)

# TEMPORAL: prueba de escritorio real en Windows. No mergear.
on:
  push:
    branches: [ccr-354f5a27-zxfpyi]
    paths:
      - ".github/workflows/escritorio.yml"
      - "pruebas_escritorio/**"

jobs:
  escritorio:
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        intento: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias
        run: pip install -e ".[dev]" pywinauto==0.6.9

      - name: Construir los ejecutables
        run: pyinstaller empaquetar/CifrarPDF.spec --noconfirm

      - name: Conjunto de escritorio
        env:
          SALIDA: ${{ runner.temp }}\salida
        run: python pruebas_escritorio/conducir.py conjunto dist\CifrarPDF

      - name: Limpieza
        if: always()
        shell: pwsh
        run: |
          & "dist\CifrarPDF\CifrarPDF-cli.exe" --parar
          Get-Process CifrarPDF* -ErrorAction SilentlyContinue | Format-Table Id, ProcessName, StartTime
          Stop-Process -Name CifrarPDF -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: escritorio-${{ matrix.intento }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\salida
          if-no-files-found: warn
